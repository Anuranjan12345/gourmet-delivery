
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Delivery - Your Cart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="cart-page">
    <nav class="navbar">
        <a href="index.html" class="navbar-brand" aria-label="Gourmet Delivery home">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M11 21.73a2 2 0 0 0 2.98 0l7-7.68a2 2 0 0 0 .5-1.55 9.77 9.77 0 0 0-4.48-8.29 2 2 0 0 0-2 .14l-3 2.5-3-2.5a2 2 0 0 0-2-.14 9.77 9.77 0 0 0-4.48 8.29 2 2 0 0 0 .5 1.55z"></path>
            </svg>
            Gourmet<span>Delivery</span>
        </a>
 <ul class="navbar-nav" id="navbar-links"></ul>
    </nav>

    <main class="cart-main">

        <header class="page-intro cart-intro">
            <p class="eyebrow">YOUR SELECTION</p>
            <h1>Your Cart</h1>
            <p>Review your favourites before placing your order.</p>

            <a href="index.html" class="back-link">

        </header>

        <section id="cart-container" aria-live="polite">
            <div class="cart-loading">
                <span class="cart-loading-dot"></span>
                Loading your cart...
            </div>
        </section>

    </main>

    <script src="js/script.js"></script>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - FoodExpress</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        
<a href="index.html" class="navbar-brand">
    <svg xmlns="http://www.w3.org/2000/svg"
         width="24" height="24"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         style="color:var(--primary)">
        <path d="M11 21.73a2 2 0 0 0 2.98 0l7-7.68a2 2 0 0 0 .5-1.55 9.77 9.77 0 0 0-4.48-8.29 2 2 0 0 0-2 .14l-3 2.5-3-2.5a2 2 0 0 0-2-.14 9.77 9.77 0 0 0-4.48 8.29 2 2 0 0 0 .5 1.55z"></path>
    </svg>
    Gourmet<span>Delivery</span>
</a>
>

        <ul class="navbar-nav" id="navbar-links"></ul>
    </nav>

    <main class="container" style="padding-top: 40px; padding-bottom: 40px;">
        <section class="card" style="max-width: 600px; margin: 0 auto;">
            <div class="card-body">
                <h1>My Profile</h1>
                <p style="color: var(--text-muted); margin: 8px 0 24px;">
                    View your account information.
                </p>

                <div style="margin-bottom: 20px;">
                    <p style="color: var(--text-muted);">User ID</p>
                    <p id="profile-id">Loading...</p>
                </div>

                <div style="margin-bottom: 20px;">
                    <p style="color: var(--text-muted);">Full Name</p>
                    <p id="profile-name">Loading...</p>
                </div>

                <div style="margin-bottom: 24px;">
                    <p style="color: var(--text-muted);">Email Address</p>
                    <p id="profile-email">Loading...</p>
                </div>

                <p id="profile-message"
                   role="status"
                   style="margin-bottom: 16px;"></p>

                <button
                    type="button"
                    id="logout-button"
                    class="btn btn-danger">
                    Log Out
                </button>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = AuthService.getUser();
            const message = document.getElementById('profile-message');

            if (!AuthService.isAuthenticated() || !user) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('profile-id').textContent =
                user.id ?? 'Not available';

            document.getElementById('profile-name').textContent =
                user.name || 'Not available';

            document.getElementById('profile-email').textContent =
                user.email || 'Not available';

            document.getElementById('logout-button')
                .addEventListener('click', () => {
                    const confirmLogout =
                        window.confirm('Are you sure you want to log out?');

                    if (confirmLogout) {
                        AuthService.logout();
                    }
                });
        });
    </script>

</body>
</html>
